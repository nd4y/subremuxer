name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Lint & test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q

  docker:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    name: Smoke-test the image
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the container and hit it
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}:sha-$(git rev-parse --short HEAD)"
          docker run -d --name subremuxer -p 8000:8000 -e ADMIN_PASSWORD=ci-password "$IMAGE"
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:8000/healthz | grep -q '"ok"'

          # The shell, with its asset URLs versioned so a redeploy cannot leave a
          # browser on the previous release's JS.
          shell=$(curl -fsS http://127.0.0.1:8000/)
          echo "$shell" | grep -q '<title>Sub Remuxer</title>'
          echo "$shell" | grep -qE '/static/app\.js\?v=[0-9a-f]{10}'

          # Installability: manifest, both icon sizes, and a root-scoped worker.
          curl -fsS http://127.0.0.1:8000/manifest.webmanifest | grep -q '"start_url"'
          curl -fsS -o /dev/null http://127.0.0.1:8000/static/icon-192.png
          curl -fsS -o /dev/null http://127.0.0.1:8000/static/icon-512.png
          curl -fsSD - -o /dev/null http://127.0.0.1:8000/sw.js | grep -qi 'service-worker-allowed: /'
          # The placeholder must have been substituted, or the cache never rotates.
          ! curl -fsS http://127.0.0.1:8000/sw.js | grep -q '__VERSION__'

          # An unauthenticated admin call must be refused.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/profiles)" = "401"

          docker logs subremuxer
          docker rm -f subremuxer

      - name: Honour an assigned PORT
        run: |
          # Railway and friends inject PORT and route to it; ignoring it is the
          # classic reason a container passes locally and fails a health check.
          IMAGE="${REGISTRY}/${IMAGE_NAME}:sha-$(git rev-parse --short HEAD)"
          docker run -d --name subremuxer-port -e PORT=7777 -p 7777:7777 \
            -e ADMIN_PASSWORD=ci-password "$IMAGE"
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7777/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:7777/healthz | grep -q '"ok"'
          docker logs subremuxer-port
          docker rm -f subremuxer-port

      - name: Start on a root-owned volume
        run: |
          # Hosted platforms mount volumes owned by root. The entrypoint has to
          # take ownership and drop privileges, or SQLite cannot even be created.
          IMAGE="${REGISTRY}/${IMAGE_NAME}:sha-$(git rev-parse --short HEAD)"
          sudo mkdir -p /tmp/rootvol && sudo chown 0:0 /tmp/rootvol && sudo chmod 755 /tmp/rootvol
          docker run -d --name subremuxer-vol -p 8002:8000 \
            -e ADMIN_PASSWORD=ci-password -v /tmp/rootvol:/data "$IMAGE"
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8002/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8002/healthz | grep -q '"ok"'
          # The app must not be running as root once it is up.
          test "$(docker exec subremuxer-vol id -u)" = "10001"
          sudo test -f /tmp/rootvol/subremuxer.db
          docker logs subremuxer-vol
          docker rm -f subremuxer-vol

      - name: Demo mode opens the admin API and says so
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}:sha-$(git rev-parse --short HEAD)"
          docker run -d --name subremuxer-demo -p 8001:8000 -e DEMO_MODE=true "$IMAGE"
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8001/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8001/api/auth/me | grep -q '"demo":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8001/api/profiles)" = "200"
          docker logs subremuxer-demo 2>&1 | grep -q 'DEMO_MODE'
          docker rm -f subremuxer-demo
